apiVersion: orderflow.aws.agentic/v1
kind: AgentCoreCedarGatewayPolicy
metadata:
  name: orderflow-ops-gw-cedar
  owner: kien-nguyen
spec:
  policy_engine: agentcore-cedar
  cedar_version: v4.15.0
  gateway_id: orderflow-ops-gw
  aws_account_id: "111122223333"
  aws_region: us-east-1
  enforcement_mode: ENFORCE
  schema_file: ch06/01-orderflow-agentcore.cedarschema.json
  policy_file: ch06/02-orderflow-gateway.cedar
  permitted_actions:
    - cloudwatch___get_metric_data
    - aurora___describe_db_clusters
    - eks___list_insights
    - devopsagent___list_journal_records
  forbidden_actions:
    - aurora___delete_db_cluster
    - kms___schedule_key_deletion
    - iam___attach_role_policy
